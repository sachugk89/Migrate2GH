name: ".NET Build and Publish Package"
description: "Builds a .NET package and publishes it to GitHub Packages"
author: "Your Name or Organization"
inputs:
  solution:
    description: "Path to the .sln file"
    required: true
  package_name:
    description: "Name of the package to publish"
    required: true
  package_version:
    description: "Version of the package to publish"
    required: true
  github_token:
    description: "GitHub token for authentication"
    required: true

runs:
  using: "composite"
  steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Setup .NET Framework
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    # Restore NuGet packages
    - name: Restore NuGet packages
      run: nuget restore ${{ inputs.solution }}

    # Build the solution
    - name: Build solution
      run: msbuild ${{ inputs.solution }} /p:Configuration=Release

    # Pack the NuGet package
    - name: Pack NuGet package
      run: |
        nuget pack ${{ inputs.package_name }}.csproj -Version ${{ inputs.package_version }} -OutputDirectory ./output

    # Publish the package to GitHub Packages
    - name: Publish to GitHub Packages
      run: |
        nuget push ./output/${{ inputs.package_name }}.${{ inputs.package_version }}.nupkg -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -ApiKey ${{ inputs.github_token }}