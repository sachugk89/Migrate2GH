# This is a basic workflow to help you get started with Actions
 
name: GHActionImporter
 
# Controls when the workflow will run
on:
  # # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: 'QA'
    env:
      #GH_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ secrets.GH_PULLSEC }}
      ADO_ORG: ${{ secrets.ADO_ORG }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
      ADO_PROJECT: ${{ secrets.ADO_PRJ }}
      GH_ORG: ${{ secrets.GH_ORG }}
      GITHUB_ACCESS_TOKEN : ${{ secrets.GH_PULLSEC }}
      GITHUB_INSTANCE_URL : "https://github.com"
      AZURE_DEVOPS_ACCESS_TOKEN : ${{ secrets.ADO_PAT }}
      AZURE_DEVOPS_INSTANCE_URL : "https://dev.azure.com"
      AZURE_DEVOPS_ORGANIZATION : ${{ secrets.ADO_ORG }}
      AZURE_DEVOPS_PROJECT : ${{ secrets.ADO_PRJ }}
      
             

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: CheckGH Version
        run: gh --version
      - name : MakeHomeImporter
        continue-on-error: true
        run: |
          mkdir HomeGHAImporter 
          cd HomeGHAImporter 
      - name: InstalllADOActionImporter
        run: |
          cd HomeGHAImporter 
          gh extension install github/gh-actions-importer
      
      # - name: configureADOActionImporter
      #   continue-on-error: true
      #   run: |
      #     cd HomeGHAImporter 
      #     gh actions-importer configure
      - name: updateADOActionImporter
        continue-on-error: true
        run: |
          cd HomeGHAImporter 
          gh actions-importer update
      - name: AuditlADOActionImporter
        continue-on-error: true
        run: |
          while IFS=, read -r teamproject _; do
          if [ "$teamproject" != "teamproject" ]; then # Skip the header row
            gh actions-importer audit azure-devops --output-dir ./HomeGHAImporter -p "$teamproject"
          fi
          done < <(cut -d',' -f1 ./HomeADO2GH/team-projects.csv)
      - name: ForecastADOActionImporter
        continue-on-error: true
        run: |
          cd HomeGHAImporter 
          gh actions-importer forecast azure-devops --output-dir ./HomeGHAImporter
          
      - name: GITPUSH
        run: |
         
         git config user.name "sachhugk89"
         git config user.email "sachugk@live.com"
         git add *
         git diff-index --quiet HEAD || git commit -m "Initial commit" && git push https://${{ secrets.GH_PULLSEC }}@github.com/sachugk89/Migrate2GH.git
     
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: adoreport
      #     path: /home/runner/work/Migrate2GH/Migrate2GH/adoreports
          

